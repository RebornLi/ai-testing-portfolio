[pytest]
# Resolve test modules by full path (not bare basename) and don't rely on
# pytest's default test-file-dir insertion. This keeps every lab green under a
# single `pytest` run from the repo root (no `test_tool_calling.py` basename
# collision between auto-eval/ and eval-lab/), and makes combined runs match
# the regression test which passes `--import-mode=importlib` explicitly.
#
# CI is unaffected: each lab runs in its own Docker image built from the lab
# directory, so this root config never reaches the CI container.
addopts = -p no:cacheprovider --import-mode=importlib
